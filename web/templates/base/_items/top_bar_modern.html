<header class="h-16 bg-white dark:bg-slate-950 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-8 sticky top-0 z-40">
  <div class="flex items-center gap-4">
    <button @click="$dispatch('toggle-sidebar')" class="p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-900 rounded-lg transition-colors lg:flex hidden">
      <i data-lucide="menu" class="w-5 h-5"></i>
    </button>
    <button @click="$dispatch('toggle-mobile-sidebar')" class="p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-900 rounded-lg transition-colors lg:hidden">
      <i data-lucide="menu" class="w-5 h-5"></i>
    </button>
    
    <div class="h-6 w-[1px] bg-slate-200 dark:bg-slate-800 hidden lg:block"></div>

    <!-- Universal Search (Trigger for Command Palette) -->
    <div class="relative hidden md:block">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <i data-lucide="search" class="h-4 w-4 text-slate-400"></i>
      </div>
      <input type="text" 
             class="block w-64 pl-10 pr-3 py-1.5 border border-slate-200 dark:border-slate-800 rounded-lg bg-slate-50 dark:bg-slate-900/50 text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all" 
             placeholder="Search targets, scans..."
             @keydown.meta.k.window.prevent="$el.focus()"
             @keydown.ctrl.k.window.prevent="$el.focus()">
      <div class="absolute inset-y-0 right-0 pr-2 flex items-center pointer-events-none">
        <kbd class="hidden sm:inline-block px-1.5 py-0.5 border border-slate-300 dark:border-slate-700 rounded bg-white dark:bg-slate-800 text-[10px] font-sans font-medium text-slate-400 shadow-sm">
          ⌘K
        </kbd>
      </div>
    </div>
  </div>

  <div class="flex items-center gap-3">
    <!-- Project Selector -->
    <div class="relative" x-data="{ open: false }">
      <button @click="open = !open" @click.away="open = false" class="flex items-center gap-2 px-3 py-1.5 bg-sky-500/10 text-sky-600 dark:text-sky-400 rounded-lg text-xs font-bold hover:bg-sky-500/20 transition-colors">
        <i data-lucide="folder" class="w-3.5 h-3.5"></i>
        <span>{{ current_project.name|default:"Select Project" }}</span>
        <i data-lucide="chevron-down" class="w-3.5 h-3.5 transition-transform" :class="open ? 'rotate-180' : ''"></i>
      </button>
      
      <div x-show="open" 
           x-transition:enter="transition ease-out duration-100"
           x-transition:enter-start="opacity-0 scale-95"
           x-transition:enter-end="opacity-100 scale-100"
           class="absolute right-0 mt-2 w-56 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-xl z-50 overflow-hidden">
        <div class="px-3 py-2 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50">
          <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Switch Project</p>
        </div>
        <div class="max-height-[300px] overflow-y-auto py-1">
          {% for user_project in projects %}
          <a href="{% url 'set_current_project' user_project.slug %}" class="flex items-center justify-between px-3 py-2 text-sm {% if user_project == current_project %} text-sky-500 bg-sky-500/5 {% else %} text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/50 {% endif %} transition-colors">
            <span class="truncate">{{ user_project.name }}</span>
            {% if user_project == current_project %}
            <i data-lucide="check" class="w-3.5 h-3.5"></i>
            {% endif %}
          </a>
          {% endfor %}
        </div>
        <div class="border-t border-slate-200 dark:border-slate-800 p-1">
          <a href="#" class="flex items-center gap-2 px-3 py-2 text-sm text-sky-500 hover:bg-sky-500/5 rounded-lg transition-colors">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>New Project</span>
          </a>
        </div>
      </div>
    </div>

    <div class="h-6 w-[1px] bg-slate-200 dark:bg-slate-800"></div>

    <!-- Theme Toggle -->
    <button onclick="changeTheme()" class="p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-900 rounded-lg transition-colors">
      <i data-lucide="sun" class="w-5 h-5 dark:hidden"></i>
      <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
    </button>

    <!-- Scan Activity -->
    <button class="p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-900 rounded-lg transition-colors relative" 
            onclick="getScanStatusSidebar('{% url 'api:scan_status' %}', '{% url 'api:stop_scan' %}', '{% url 'api:stop_activity' %}', '{% url 'api:fetch_subscan_results' %}', { project: '{{ current_project.slug|default:'' }}', reload: false, openBar: true })">
      <i data-lucide="activity" class="w-5 h-5"></i>
      <span class="absolute top-1 right-1 w-2 h-2 bg-rose-500 rounded-full border-2 border-white dark:border-slate-950" id="scan-activity-dot" style="display: none;"></span>
    </button>
  </div>
</header>
