{% load permission_tags %}
<td class="text-center">
  <div class="flex flex-wrap gap-1 justify-center mb-2">
    {% if user|can:'initiate_scans_subscans' %}
    <a href="{% url 'start_organization_scan' current_project.slug organization.id %}" class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-500/20 transition-colors" data-toggle="tooltip" data-placement="top" title="Quick Scan Entire Organization"><i data-lucide="zap" class="w-4 h-4"></i></a>
    <a href="{% url 'schedule_organization_scan' current_project.slug organization.id %}" class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-500/20 transition-colors open-domain" data-toggle="tooltip" data-placement="top" title="Schedule Scan"><i data-lucide="clock" class="w-4 h-4"></i></a>
    {% endif %}
    {% if user|can:'modify_targets' %}
    <a href="{% url 'update_organization' current_project.slug organization.id %}" class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-sky-500/10 text-sky-600 dark:text-sky-400 hover:bg-sky-500/20 transition-colors open-domain" data-toggle="tooltip" data-placement="top" title="Update Organization"><i data-lucide="edit-2" class="w-4 h-4"></i></a>
    <a href="#" class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-rose-500/10 text-rose-600 dark:text-rose-400 hover:bg-rose-500/20 transition-colors" data-toggle="tooltip" data-placement="top" title="Delete Organization" onclick="delete_organization('{% url 'delete_organization' current_project.slug organization.id %}'); return false;"><i data-lucide="trash-2" class="w-4 h-4"></i></a>
    {% endif %}
  </div>
</td>
