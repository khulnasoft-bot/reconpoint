{# Reusable quick search input for DataTables. Expect quick_search_input_id and optional placeholder. #}
<div class="ms-2 mt-1 inline-flex items-center">
  <label for="{{ quick_search_input_id }}" class="me-1 mb-0 text-sm text-slate-500 dark:text-slate-400">Search</label>
  <input
    type="text"
    id="{{ quick_search_input_id }}"
    class="w-48 px-3 py-1.5 text-sm border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-sky-500 focus:border-sky-500"
    placeholder="{{ quick_search_placeholder|default:'Type to search' }}"
    autocomplete="off"
  >
</div>
