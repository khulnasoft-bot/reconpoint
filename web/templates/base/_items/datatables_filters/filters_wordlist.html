<div class="">
  <label for="filterByName" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Filter by Wordlist Name (multi-select)</label>
  <select class="w-full px-3 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-sky-500 focus:border-sky-500" id="filterByName" multiple size="3">
    {% for name in wordlist_name_list %}
      <option value="{{ name }}">{{ name }}</option>
    {% endfor %}
  </select>
</div>
