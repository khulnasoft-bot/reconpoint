<div class="col-9 float-start">
    <a class="disabled inline-flex items-center px-3 py-1.5 text-xs font-medium rounded-lg bg-sky-500/10 text-sky-600 dark:text-sky-400 hover:bg-sky-500/20 transition-colors ms-0" data-button="subdomain_btns" data-toggle="tooltip" data-placement="top" title="Initiate Multiple Subscans" onclick="initiateMultipleSubscan()">
      <i data-lucide="zap" class="w-4 h-4 mr-1"></i>
      <span class="hidden md:inline">Initiate Subscan</span>
    </a>
    <a class="disabled inline-flex items-center px-3 py-1.5 text-xs font-medium rounded-lg bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-500/20 transition-colors" data-button="subdomain_btns" data-toggle="tooltip" data-placement="top" title="Download Selected Subdomains" onclick="downloadSelectedSubdomains('{% if target_summary %}{{ target.value|escapejs }}{% else %}{{ scan_display_name|escapejs }}{% endif %}')">
      <i data-lucide="download" class="w-4 h-4 mr-1"></i>
      <span class="hidden md:inline">Download Selected Subdomains</span>
    </a>
    <a class="disabled inline-flex items-center px-3 py-1.5 text-xs font-medium rounded-lg bg-rose-500/10 text-rose-600 dark:text-rose-400 hover:bg-rose-500/20 transition-colors" data-button="subdomain_btns" data-toggle="tooltip" data-placement="top" title="Delete Multiple Subdomains" onclick="deleteMultipleSubdomains()">
      <i data-lucide="trash" class="w-4 h-4 mr-1"></i>
      <span class="hidden md:inline">Delete Multiple Subdomains</span>
    </a>
    <div class="ms-2 mt-2" id="">
      <a href="#" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-sky-500/10 text-sky-600 dark:text-sky-400" id="subdomain_selected_count" onclick="uncheckSubdomains()"  data-toggle="tooltip" data-placement="top" title="Clear Subdomains"></a>
    </div>
  </div>
  <div class="col-3">
    <div class="inline-flex mb-2 float-end dropstart">
      <button class="inline-flex items-center px-3 py-1.5 text-xs font-medium rounded-lg bg-sky-500/10 text-sky-600 dark:text-sky-400 hover:bg-sky-500/20 transition-colors dropdown-toggle ms-1" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false" data-toggle="tooltip" data-placement="left" title="Filter Columns">
        <i data-lucide="filter" class="w-4 h-4"></i>
      </button>
      <div class="dropdown-menu" style="">
        <div class="dropdown-item">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="sub_http_status_filter_checkbox" name="sub_http_status_filter_checkbox" checked>
            <label class="form-check-label" for="http_status_filter_checkbox">HTTP Status</label>
          </div>
        </div>
        <div class="dropdown-item">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="sub_page_title_filter_checkbox" name="sub_page_title_filter_checkbox" checked>
            <label class="form-check-label" for="page_title_filter_checkbox">Page Title</label>
          </div>
        </div>
        <div class="dropdown-item">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="sub_ip_filter_checkbox" name="sub_ip_filter_checkbox" checked>
            <label class="form-check-label" for="ip_filter_checkbox">IP Address</label>
          </div>
        </div>
        <div class="dropdown-item">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="sub_ports_filter_checkbox" name="sub_ports_filter_checkbox" checked>
            <label class="form-check-label" for="ports_filter_checkbox">Ports</label>
          </div>
        </div>
        <div class="dropdown-item">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="sub_content_length_filter_checkbox" name="sub_content_length_filter_checkbox" checked>
            <label class="form-check-label" for="content_length_filter_checkbox">Content Length</label>
          </div>
        </div>
        <div class="dropdown-item">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="sub_response_time_filter_checkbox" name="sub_response_time_filter_checkbox" checked>
            <label class="form-check-label" for="response_time_filter_checkbox">Response Time</label>
          </div>
        </div>

      </div>

      <a class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-sky-500/10 text-sky-600 dark:text-sky-400 hover:bg-sky-500/20 transition-colors ms-2 me-2" data-toggle="tooltip" data-placement="top" title="Reload Subdomains" id="reload_subdomain_table_btn">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
      </a>

      <button class="inline-flex items-center px-3 py-1.5 text-xs font-medium rounded-lg bg-sky-500 text-white hover:bg-sky-600 transition-colors dropdown-toggle" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false" data-toggle="tooltip" data-placement="left" title="Download Subdomains">
        <i data-lucide="download" class="w-4 h-4"></i>
      </button>
      <div class="dropdown-menu" style="">
        {% include 'base/_items/_subdomain_download_links.html' %}
      </div>

    </div>
  </div>
