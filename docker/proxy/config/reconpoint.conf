upstream reconpoint_web {
    server                                          web:8000;
    keepalive                                       32;
}

server {
    listen                                          8082 default;
    listen                                          [::]:8082 default;
    server_name                                     reconpoint recon;
    return                                          301 https://$host$request_uri;
}


server {
    listen                                          443 ssl;
    listen                                          [::]:443 ssl;
    http2                                           on;
    server_name                                     reconpoint recon;

    server_tokens                                   off;
    charset                                         utf-8;
    keepalive_timeout                               70;
    client_header_timeout                           60s;
    client_body_timeout                             60s;
    send_timeout                                    60s;
    client_max_body_size                            800M;
    client_body_buffer_size                         32M;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header X-XSS-Protection "0" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https: ws: wss:; frame-ancestors 'none'; base-uri 'self';" always;

    gzip                                            on;
    gzip_types                                      application/json application/javascript text/css text/html text/plain image/svg+xml;
    gzip_min_length                                 1024;
    gzip_proxied                                    any;
    gzip_comp_level                                 5;
    gzip_disable                                    "msie6";

    proxy_buffering                                 on;
    proxy_buffers                                   8 16k;
    proxy_busy_buffers_size                         32k;
    proxy_temp_file_write_size                      64k;

    location / {
        proxy_http_version                           1.1;
        proxy_set_header                            Connection "";
        proxy_read_timeout                          300;
        proxy_connect_timeout                       300;
        proxy_send_timeout                          300;
        proxy_redirect                              off;

        proxy_set_header                            Host $host;
        proxy_set_header                            X-Forwarded-Host $host;
        proxy_set_header                            X-Real-IP $remote_addr;
        proxy_set_header                            X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header                            X-Forwarded-Proto $scheme;
        proxy_pass                                  http://reconpoint_web/;
    }

    location /staticfiles/ {
        alias /home/reconpoint/reconpoint/staticfiles/;
    }


    # WebSocket support
    location /ws/ {
        proxy_pass                                  http://reconpoint_web;
        proxy_http_version                          1.1;
        proxy_set_header                            Upgrade $http_upgrade;
        proxy_set_header                            Connection "upgrade";
        proxy_set_header                            Host $host;
        proxy_set_header                            X-Real-IP $remote_addr;
        proxy_set_header                            X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header                            X-Forwarded-Proto $scheme;
        proxy_read_timeout                          86400;  # 24 hours
    }

    location /api/tool/ollama/ {
        proxy_pass                                  http://web:8000;
        proxy_http_version                          1.1;
        proxy_set_header                            Connection '';
        proxy_buffering                             off;
        proxy_cache                                 off;
        proxy_read_timeout                          600s;  # 10 minutes timeout
    }

    # Scan files (screenshots, stored responses) are served via Django with project access control
    # at /api/scan-files/<path>. Do not alias /media/ to scan_results to avoid direct access.

    ssl_protocols                                   TLSv1.2 TLSv1.3;

    ssl_certificate                                 /etc/nginx/certs/reconpoint.pem;                 # RSA certificate in PEM format.
    ssl_certificate_key                             /etc/nginx/certs/reconpoint_rsa.key;             # Secret key in PEM format.
    ssl_trusted_certificate                         /etc/nginx/certs/reconpoint_chain.pem;           # Certificate chain.

    ssl_ciphers                                     '!EDH:!EXP:!SHA:!DSS:EECDH+aRSA+AESGCM:EECDH+aRSA+SHA384:EECDH+aRSA+SHA256';  # Cipher suite (see https://tls.imirhil.fr/suite/ and `openssl ciphers | sed -r -e 's/:/\n/g'`).
    ssl_prefer_server_ciphers                       on;                                                 # Specifies that server ciphers should be preferred over client ciphers.

    # ssl_dhparam                                     /etc/ssl/private/private/dh4096.pem;                # Diffie-Hellman server params with 4096 bits (generated using `openssl dhparam 4096 -out /etc/ssl/private/private/dh4096.pem`).
    ssl_ecdh_curve                                  secp384r1:X25519:prime256v1;                        # Elliptic Curve Diffie-Hellman server params.

    ssl_session_cache                               shared:SSL:10m;                                     # Create a shared cache able to store about 80000 sessions (about 4000 for 1MB storage).
    ssl_session_timeout                             5m;                                                 # Timeout before session to be dropped.
    ssl_session_tickets                             off;                                                # Disable TLS session tickets.
}
